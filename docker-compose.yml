version: '3.8'

services:
  bot:
    build: .
    restart: unless-stopped
    container_name: auto_approve_bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - OWNER_ID=${OWNER_ID}
      - ADMINS=${ADMINS}
      - MONGO_URL=mongodb://mongo:27017/AutoApproveBot
      - DATABASE_NAME=${DATABASE_NAME:-AutoApproveBot}
      - MAX_APPROVALS_PER_SECOND=${MAX_APPROVALS_PER_SECOND:-25}
      - ENABLE_CAS_CHECK=${ENABLE_CAS_CHECK:-true}
      - START_PIC=${START_PIC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-UTC}
      - DEFAULT_PLAN=${DEFAULT_PLAN:-FREE}
      - QUOTA_RESET_HOUR=${QUOTA_RESET_HOUR:-0}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY}
      - PORT=${PORT:-8080}
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    container_name: auto_approve_mongo
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

